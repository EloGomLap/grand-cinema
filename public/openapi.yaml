openapi: 3.0.3
info:
  title: API Grand Cinéma
  version: 1.1.0
  description: |
    API REST de l'application de réservation du Grand Cinéma.

    - La consultation (GET des films, salles et séances) est publique.
    - Les autres opérations demandent un compte : cliquez sur **Authorize** et saisissez
      l'email et le mot de passe du compte (HTTP Basic). Le rôle requis est indiqué
      sur chaque route (PROGRAMMATEUR, GUICHETIER, CONTROLEUR, CLIENT ou ADMIN).
servers:
  - url: /
tags:
  - name: Films
    description: Banque de films du cinéma
  - name: Séances
    description: Salles et programmation des séances
paths:
  /api/films:
    get:
      tags: [Films]
      summary: Lister les films
      description: Renvoie les films triés par titre, éventuellement filtrés par genre.
      parameters:
        - name: genre
          in: query
          required: false
          schema: { type: string }
          example: Biopic
      responses:
        '200':
          description: Liste des films
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Film' }
    post:
      tags: [Films]
      summary: Ajouter un film
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilmSaisie' }
      responses:
        '201':
          description: Film créé
          headers:
            Location:
              schema: { type: string }
              description: URL du film créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Film' }
        '400': { $ref: '#/components/responses/DonneesInvalides' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
  /api/films/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Films]
      summary: Consulter un film
      responses:
        '200':
          description: Le film demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Film' }
        '404': { $ref: '#/components/responses/Introuvable' }
    put:
      tags: [Films]
      summary: Modifier un film
      description: Seuls les champs envoyés sont modifiés.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilmSaisie' }
      responses:
        '200':
          description: Film modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Film' }
        '400': { $ref: '#/components/responses/DonneesInvalides' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
        '404': { $ref: '#/components/responses/Introuvable' }
    delete:
      tags: [Films]
      summary: Supprimer un film
      security: [{ basicAuth: [] }]
      responses:
        '204': { description: Film supprimé }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /api/salles:
    get:
      tags: [Séances]
      summary: Lister les salles
      responses:
        '200':
          description: Salles du cinéma avec leur capacité
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Salle' }
  /api/seances:
    post:
      tags: [Séances]
      summary: Programmer une séance (PROGRAMMATEUR)
      description: |
        Refusée si la salle est déjà occupée sur ce créneau : un film occupe la salle
        pendant sa durée plus 20 minutes (bandes-annonces et nettoyage).
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeanceSaisie' }
      responses:
        '201':
          description: Séance programmée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seance' }
        '400': { $ref: '#/components/responses/DonneesInvalides' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
  /api/seances/{id}:
    get:
      tags: [Séances]
      summary: Consulter une séance
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: La séance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seance' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /api/salles/disponibilite:
    get:
      tags: [Séances]
      summary: Disponibilité des salles sur une journée (PROGRAMMATEUR)
      security: [{ basicAuth: [] }]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date }, description: "Jour (AAAA-MM-JJ), aujourd'hui par défaut" }
      responses:
        '200':
          description: Pour chaque salle, les séances et les créneaux libres entre 10:00 et minuit
          content:
            application/json:
              example:
                date: '2026-11-21'
                salles:
                  - salle: { id: 1, nom: Salle 1, capacite: 60 }
                    seances: [{ id: 4, film: Bird, debut: '14:00', fin: '17:01' }]
                    creneauxLibres: [{ debut: '10:00', fin: '14:00', minutes: 240 }, { debut: '17:01', fin: '23:59', minutes: 418 }]
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Film:
      type: object
      properties:
        id: { type: integer, example: 1 }
        titre: { type: string, example: Round Midnight }
        synopsis: { type: string, nullable: true }
        dureeMinutes: { type: integer, example: 133 }
        realisateur: { type: string, nullable: true, example: Bertrand Tavernier }
        genre: { type: string, nullable: true, example: Drame musical }
        classification: { type: string, nullable: true, enum: ['Tous publics', '-12', '-16', '-18'] }
        afficheUrl: { type: string, format: uri, nullable: true }
        dateSortie: { type: string, format: date, nullable: true, example: '1986-11-05' }
    FilmSaisie:
      type: object
      required: [titre, dureeMinutes]
      properties:
        titre: { type: string, maxLength: 200, example: Whiplash }
        synopsis: { type: string }
        dureeMinutes: { type: integer, minimum: 1, maximum: 600, example: 107 }
        realisateur: { type: string, maxLength: 150, example: Damien Chazelle }
        genre: { type: string, maxLength: 50, example: Drame musical }
        classification: { type: string, enum: ['Tous publics', '-12', '-16', '-18'] }
        afficheUrl: { type: string, format: uri }
        dateSortie: { type: string, format: date, example: '2014-12-24' }
    Salle:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nom: { type: string, example: Salle Jazz }
        capacite: { type: integer, example: 24 }
    Seance:
      type: object
      properties:
        id: { type: integer, example: 12 }
        film:
          type: object
          properties:
            id: { type: integer }
            titre: { type: string, example: Whiplash }
            dureeMinutes: { type: integer, example: 107 }
        salle: { $ref: '#/components/schemas/Salle' }
        debut: { type: string, format: date-time, example: '2026-11-21T20:30:00+01:00' }
        fin: { type: string, format: date-time, description: Fin du film + 20 minutes }
        langue: { type: string, enum: [VF, VOSTFR] }
        prix: { type: number, example: 9.5 }
    SeanceSaisie:
      type: object
      required: [filmId, salleId, debut, prix]
      properties:
        filmId: { type: integer, example: 3 }
        salleId: { type: integer, example: 1 }
        debut: { type: string, example: '2026-12-01T20:30', description: AAAA-MM-JJTHH:MM, heure de Paris }
        langue: { type: string, enum: [VF, VOSTFR], default: VF }
        prix: { type: number, example: 9.5 }
    Erreur:
      type: object
      properties:
        erreur: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
          example: { titre: Le titre est obligatoire. }
  responses:
    DonneesInvalides:
      description: Données invalides (JSON mal formé ou règles métier non respectées)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    NonAuthentifie:
      description: Authentification requise
    AccesRefuse:
      description: Rôle insuffisant pour cette action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
