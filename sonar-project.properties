# Analyse de qualité SonarCloud (lancée par l'intégration continue, voir .github/workflows/ci.yml)
sonar.organization=elogomlap
sonar.projectKey=EloGomLap_grand-cinema
sonar.projectName=Grand Cinéma
sonar.projectVersion=1.1.0

# Code analysé et tests
sonar.sources=src,templates,public
sonar.exclusions=public/index.php
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Résultats de PHPUnit produits par la CI : couverture (Clover) et rapport des tests (JUnit)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml
